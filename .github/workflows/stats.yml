name: Generate stats card

on:
  schedule: # a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Todas as opções visuais ficam AQUI, não na URL do README
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=gotham&locale=pt-br
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}